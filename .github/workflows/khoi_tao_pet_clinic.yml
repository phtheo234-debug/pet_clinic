name: Khoi tao ma nguon Pet Clinic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/khoi_tao_pet_clinic.yml
      - .github/scripts/refactor_petclinic.py
      - .github/templates/tao_cac_bang_nghiep_vu.php
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dong-bo-va-chuan-hoa:
    runs-on: ubuntu-latest
    steps:
      - name: Lay repository pet_clinic
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Lay ma nguon PET-CLINIC
        run: git clone --depth 1 --branch main https://github.com/phtheo234-debug/PET-CLINIC.git "$RUNNER_TEMP/PET-CLINIC"

      - name: Sao chep ma nguon
        run: rsync -a --delete --exclude='.git/' --exclude='.github/' "$RUNNER_TEMP/PET-CLINIC/" ./

      - name: Chuan hoa ten va migrations
        run: python .github/scripts/refactor_petclinic.py

      - name: Kiem tra cu phap PHP va JavaScript
        run: |
          find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Day ket qua len main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
            exit 0
          fi
          git commit -m "Chuan hoa Pet Clinic va tao lai migrations"
          git push origin HEAD:main
